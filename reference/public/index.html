<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RVCE Student Management System - Reference Implementation</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Toast Notification Container (Stretch Goal) -->
  <div id="toast-container" class="toast-container" aria-live="polite"></div>

  <div class="container">
    <header>
      <div class="header-badge">RV College of Engineering • Dept. of CSE</div>
      <h1>Student Management System</h1>
      <p>Day 4: Database Integration & Full-Stack Reference Architecture</p>
    </header>

    <!-- Inline Status Banner -->
    <div id="notification" role="alert" aria-live="polite"></div>

    <!-- Section 1: Add / Edit Student Form -->
    <section class="card" aria-labelledby="form-heading">
      <h2 id="form-heading">Add New Student</h2>
      <form id="student-form" novalidate>
        <div class="form-grid">
          <div class="form-group">
            <label for="student-name">Full Name *</label>
            <input type="text" id="student-name" name="name" placeholder="e.g. Rahul Sharma" required>
          </div>

          <div class="form-group">
            <label for="student-usn">USN (University Seat Number) *</label>
            <input type="text" id="student-usn" name="usn" placeholder="e.g. 1RV23CS001" required>
          </div>

          <div class="form-group">
            <label for="student-semester">Semester (1 - 8) *</label>
            <input type="number" id="student-semester" name="semester" min="1" max="8" value="3" required>
          </div>

          <div class="form-group">
            <label for="student-branch">Branch *</label>
            <select id="student-branch" name="branch" required>
              <option value="CSE">CSE (Computer Science)</option>
              <option value="ISE">ISE (Information Science)</option>
              <option value="AIML">AIML (Artificial Intelligence)</option>
              <option value="ECE">ECE (Electronics & Comm.)</option>
              <option value="ME">ME (Mechanical)</option>
              <option value="CV">CV (Civil)</option>
            </select>
          </div>
        </div>

        <div class="form-actions">
          <button type="submit" id="submit-btn" class="btn btn-primary">Add Student</button>
          <button type="button" id="cancel-edit-btn" class="btn btn-secondary" style="display: none;">Cancel Edit</button>
        </div>
      </form>
    </section>

    <!-- Section 2: Search, Filter & Sort Controls (Stretch Goals) -->
    <section class="card filter-card" aria-labelledby="controls-heading">
      <h2 id="controls-heading" class="sr-only">Search and Filter Controls</h2>
      <div class="controls-grid">
        <div class="form-group" style="flex: 2;">
          <label for="search-input">Search (Name or USN)</label>
          <div class="search-input-wrapper">
            <input 
              type="search" 
              id="search-input" 
              placeholder="Live debounced search..." 
              autocomplete="off"
            >
            <button type="button" id="clear-search-btn" class="btn-clear" title="Clear search">✕</button>
          </div>
        </div>

        <div class="form-group" style="flex: 1;">
          <label for="branch-filter">Filter by Branch</label>
          <select id="branch-filter">
            <option value="ALL">All Branches</option>
            <option value="CSE">CSE</option>
            <option value="ISE">ISE</option>
            <option value="AIML">AIML</option>
            <option value="ECE">ECE</option>
            <option value="ME">ME</option>
            <option value="CV">CV</option>
          </select>
        </div>

        <div class="form-group" style="flex: 1;">
          <label for="sort-select">Sort By</label>
          <select id="sort-select">
            <option value="name-asc">Name (A → Z)</option>
            <option value="name-desc">Name (Z → A)</option>
            <option value="sem-asc">Semester (Low → High)</option>
            <option value="sem-desc">Semester (High → Low)</option>
            <option value="usn-asc">USN (Ascending)</option>
          </select>
        </div>
      </div>
    </section>

    <!-- Section 3: Student Directory List -->
    <section class="card" aria-labelledby="list-heading">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
        <h2 id="list-heading" style="margin-bottom: 0; border: none; padding: 0;">
          Student Directory <span id="student-count" class="badge">0</span>
        </h2>
        <button id="refresh-btn" class="btn btn-secondary" style="padding: 6px 12px; font-size: 0.85rem;">
          ↻ Refresh
        </button>
      </div>

      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>USN</th>
              <th>Name</th>
              <th>Semester</th>
              <th>Branch</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="student-table-body">
            <tr>
              <td colspan="5" class="empty-state">Loading records from MongoDB...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
