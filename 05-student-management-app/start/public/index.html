<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RVCE Student Management - Hands-on Project</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>RVCE Student Management System</h1>
      <p>Module 5 Hands-on Lab: Full CRUD & Search Integration</p>
    </header>

    <div id="notification" role="alert" aria-live="polite"></div>

    <section class="card" aria-labelledby="form-heading">
      <h2 id="form-heading">Add New Student</h2>
      <form id="student-form" novalidate>
        <div class="form-grid">
          <div class="form-group">
            <label for="student-name">Full Name *</label>
            <input type="text" id="student-name" name="name" placeholder="e.g. Rahul Sharma" required>
          </div>

          <div class="form-group">
            <label for="student-usn">USN *</label>
            <input type="text" id="student-usn" name="usn" placeholder="e.g. 1RV23CS001" required>
          </div>

          <div class="form-group">
            <label for="student-semester">Semester (1 - 8) *</label>
            <input type="number" id="student-semester" name="semester" min="1" max="8" value="3" required>
          </div>

          <div class="form-group">
            <label for="student-branch">Branch *</label>
            <select id="student-branch" name="branch" required>
              <option value="CSE">CSE</option>
              <option value="ISE">ISE</option>
              <option value="AIML">AIML</option>
              <option value="ECE">ECE</option>
              <option value="ME">ME</option>
              <option value="CV">CV</option>
            </select>
          </div>
        </div>

        <div class="form-actions">
          <button type="submit" id="submit-btn" class="btn btn-primary">Add Student</button>
          <button type="button" id="cancel-edit-btn" class="btn btn-secondary" style="display: none;">Cancel Edit</button>
        </div>
      </form>
    </section>

    <!-- Section 2: Search & Filter -->
    <section class="card" aria-labelledby="search-heading">
      <div class="search-bar-container" style="display: flex; gap: 12px; align-items: flex-end;">
        <div class="form-group" style="flex: 1;">
          <label for="search-input">Search Students (Live Debounced)</label>
          <input 
            type="search" 
            id="search-input" 
            placeholder="Type student name or USN to filter..."
            autocomplete="off"
          >
        </div>
        <button type="button" id="clear-search-btn" class="btn btn-secondary" style="height: 42px;">
          Clear
        </button>
      </div>
    </section>

    <section class="card" aria-labelledby="list-heading">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
        <h2 id="list-heading" style="margin-bottom: 0; border: none; padding: 0;">
          Student Directory <span id="student-count" class="badge">0</span>
        </h2>
      </div>

      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>USN</th>
              <th>Name</th>
              <th>Semester</th>
              <th>Branch</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="student-table-body">
            <tr>
              <td colspan="5" class="empty-state">Loading students...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
