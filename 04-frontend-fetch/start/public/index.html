<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RVCE Student Management - Full Stack Integration</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="container">
    <header>
      <h1>RVCE Student Management System</h1>

    </header>

    <!-- Inline Status / Alert Notification -->
    <div id="notification" role="alert" aria-live="polite"></div>

    <!-- Section 1: Add Student Form -->
    <section class="card" aria-labelledby="form-heading">
      <h2 id="form-heading">Add New Student</h2>
      <form id="student-form" novalidate>
        <div class="form-grid">
          <div class="form-group">
            <label for="student-name">Full Name *</label>
            <input type="text" id="student-name" name="name" placeholder="e.g. Rahul Sharma" required>
          </div>

          <div class="form-group">
            <label for="student-usn">USN (University Seat Number) *</label>
            <input type="text" id="student-usn" name="usn" placeholder="e.g. 1RV23CS001" required>
          </div>

          <div class="form-group">
            <label for="student-semester">Semester (1 - 8) *</label>
            <input type="number" id="student-semester" name="semester" min="1" max="8" value="3" required>
          </div>

          <div class="form-group">
            <label for="student-branch">Branch *</label>
            <select id="student-branch" name="branch" required>
              <option value="CSE">CSE (Computer Science)</option>
              <option value="ISE">ISE (Information Science)</option>
              <option value="AIML">AIML (Artificial Intelligence)</option>
              <option value="ECE">ECE (Electronics & Comm.)</option>
              <option value="ME">ME (Mechanical)</option>
              <option value="CV">CV (Civil)</option>
            </select>
          </div>
        </div>

        <button type="submit" id="submit-btn" class="btn btn-primary">Add Student</button>
      </form>
    </section>

    <!-- Section 2: Student Directory List -->
    <section class="card" aria-labelledby="list-heading">
      <h2 id="list-heading">Enrolled Students <span id="student-count" class="badge">0</span></h2>
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>USN</th>
              <th>Name</th>
              <th>Semester</th>
              <th>Branch</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="student-table-body">
            <tr>
              <td colspan="5" class="empty-state">Loading students from MongoDB...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </div>

  <script src="script.js"></script>
</body>

</html>
